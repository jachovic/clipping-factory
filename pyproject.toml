[project]
name = "clipping-factory"
version = "0.1.0"
description = "Autonomous AI clipping operation for paid content-rewards campaigns"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "faster-whisper>=1.0",
  "cryptography>=42",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.setuptools.package-data]
factory = ["dashboard/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
